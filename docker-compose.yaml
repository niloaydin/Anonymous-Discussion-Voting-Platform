
services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Frontend.Dockerfile
    ports:
      - "8080:3001" 
    depends_on:
      - backend

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Backend.Dockerfile
    ports:
      - "3000:3000" 
    env_file:
      - ./backend/.env
